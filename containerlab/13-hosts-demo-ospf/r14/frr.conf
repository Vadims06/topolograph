frr defaults traditional
hostname r14
no ipv6 forwarding
!
password zebra
enable password zebra
!
interface eth1
 ip address 10.14.111.1/30
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
exit
!
interface eth2
 ip address 10.14.110.1/30
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
exit
!
interface lo
 ip address 123.14.14.14/32
 ip ospf 1 area 0
exit
!
router ospf 1
 ospf router-id 123.14.14.14
exit
!

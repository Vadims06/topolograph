frr defaults traditional
hostname r10
no ipv6 forwarding
!
password zebra
enable password zebra
!
interface eth1
 ip address 123.1.1.10/24
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 15
exit
!
interface eth2
 ip address 10.10.100.1/30
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
exit
!
interface eth3
 ip address 10.10.101.1/30
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
exit
!
interface eth4
 ip address 10.10.11.1/30
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
exit
!
interface eth5
 ip address 10.1.30.1/30
 ip ospf 1 area 0
 ip ospf cost 1
exit
!
interface lo
 ip address 123.10.10.10/32
 ip ospf 1 area 0
exit
!
router ospf 1
 ospf router-id 123.10.10.10
exit
!

frr defaults traditional
hostname r101
no ipv6 forwarding
!
password zebra
enable password zebra
!
router isis lab
 net 49.0001.1231.2310.1101.00
 is-type level-2-only
 metric-style wide
 no hostname dynamic
 mpls-te on
 mpls-te router-address 123.123.101.101
exit
!
interface eth1
 ip address 10.10.101.2/30
 ip router isis lab
 isis network point-to-point
 isis metric 35
 link-params
  enable
  metric 35
  max-bw 1.25e+07
  max-rsv-bw 1.25e+07
  unrsv-bw 0 1.25e+06
  unrsv-bw 1 1.25e+06
  unrsv-bw 2 1.25e+06
  unrsv-bw 3 1.25e+06
  unrsv-bw 4 1.25e+06
  unrsv-bw 5 1.25e+06
  unrsv-bw 6 1.25e+06
  unrsv-bw 7 1.25e+06
  admin-grp 0x00000002
 exit-link-params
exit

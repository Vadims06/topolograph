frr defaults traditional
hostname r30
no ipv6 forwarding
!
password zebra
enable password zebra
!
router isis lab
 net 49.0002.1230.3003.0030.00
 is-type level-1-2
 metric-style wide
 no hostname dynamic
 mpls-te on
 mpls-te router-address 123.30.30.30
exit
!
interface eth1
 ip address 10.1.30.2/30
 ip router isis lab
 isis circuit-type level-2-only
 isis network point-to-point
 isis metric 10
 link-params
  enable
  metric 10
  max-bw 1.25e+07
  max-rsv-bw 1.25e+07
  unrsv-bw 0 1.25e+06
  unrsv-bw 1 1.25e+06
  unrsv-bw 2 1.25e+06
  unrsv-bw 3 1.25e+06
  unrsv-bw 4 1.25e+06
  unrsv-bw 5 1.25e+06
  unrsv-bw 6 1.25e+06
  unrsv-bw 7 1.25e+06
 exit-link-params
exit

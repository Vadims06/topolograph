site_name: Topolograph
site_url: https://docs.topolograph.com/
site_description: >-
  Visualize and analyze OSPF and IS-IS network topologies offline: build
  shortest and backup paths, simulate failures, plan link costs, and monitor
  your IGP in real time.
site_author: Topolograph
copyright: Copyright &copy; Topolograph

repo_name: Vadims06/topolograph
repo_url: https://github.com/Vadims06/topolograph
edit_uri: edit/master/docs/

docs_dir: docs

# Legacy release-note markdown lives under docs/release-notes/ and is not part
# of this site. Keep the images, drop the standalone pages.
exclude_docs: |
  release-notes/*.md
  release-notes/**/*.md

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    logo: material/lan
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Vadims06/topolograph
      name: Topolograph on GitHub
    - icon: fontawesome/brands/telegram
      link: https://t.me/topolograph
      name: Topolograph community on Telegram
    - icon: fontawesome/solid/globe
      link: https://topolograph.com
      name: topolograph.com

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - What is Topolograph?: getting-started/what-is-topolograph.md
      - Quick Start with Docker: getting-started/quickstart-docker.md
      - Your First Topology: getting-started/first-topology.md
  - Getting Topology In:
      - ingestion/index.md
      - Text File Upload: ingestion/text-file.md
      - GRE Session: ingestion/gre.md
      - BGP-LS Session: ingestion/bgp-ls.md
  - Analysis & Visualization:
      - analysis/index.md
      - Visualizing & Analyzing: analysis/visualizing.md
      - Comparing Network States: analysis/comparing-states.md
      - YAML-based Topologies: analysis/yaml-topologies.md
      - Traffic Engineering (TE): analysis/traffic-engineering.md
      - MPLS TE Tunnels: analysis/mpls-te-tunnels.md
  - Real-Time Monitoring:
      - monitoring/index.md
      - OSPF Watcher: monitoring/ospf-watcher.md
      - IS-IS Watcher: monitoring/isis-watcher.md
      - BMP Watcher (BGP): monitoring/bmp-watcher.md
      - Events, Timeline & Status: monitoring/events-timeline.md
      - ELK / Kibana: monitoring/elk-kibana.md
      - Zabbix: monitoring/zabbix.md
      - Webhooks & Slack: monitoring/webhooks.md
  - Automation & APIs:
      - automation/index.md
      - Python SDK: automation/python-sdk.md
      - MCP Server: automation/mcp-server.md
      - AI Agent: automation/ai-agent.md
  - Reference:
      - reference/index.md
      - Supported Vendors: reference/supported-vendors.md
      - Deployment & Configuration: reference/deployment.md
      - Changelog: reference/changelog.md
  - Community: community.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          nav_translations:
            Home: Главная
            Getting Started: Начало работы
            What is Topolograph?: Что такое Topolograph?
            Quick Start with Docker: Быстрый старт с Docker
            Your First Topology: Ваша первая топология
            Getting Topology In: Получение топологии
            Text File Upload: Загрузка текстового файла
            GRE Session: Сессия GRE
            BGP-LS Session: Сессия BGP-LS
            Analysis & Visualization: Анализ и визуализация
            Visualizing & Analyzing: Визуализация и анализ
            Comparing Network States: Сравнение состояний сети
            YAML-based Topologies: Топологии на основе YAML
            MPLS TE Tunnels: Туннели MPLS TE
            Real-Time Monitoring: Мониторинг в реальном времени
            Events, Timeline & Status: События, таймлайн и статус
            Webhooks & Slack: Webhooks и Slack
            Automation & APIs: Автоматизация и API
            Reference: Справочник
            Supported Vendors: Поддерживаемые производители
            Deployment & Configuration: Развёртывание и настройка
            Changelog: История изменений
            Community: Сообщество
        - locale: zh
          name: 中文
        - locale: pt
          name: Português
        - locale: es
          name: Español
        - locale: fr
          name: Français
